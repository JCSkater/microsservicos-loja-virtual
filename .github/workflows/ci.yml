name: CI Quality Gate

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o commitlint validar o histórico

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate PR Commit Messages
        uses: wagoid/commitlint-github-action@v6

      - name: Run Linters (Code Quality)
        run: npm run lint

      - name: Run Tests
        run: npm test
