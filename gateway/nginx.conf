events { 
    worker_connections 1024; 
}

http {
    log_format appsec_logs '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log appsec_logs;

    server {
        listen 80;
        server_name localhost;

        location /api/produtos {
            # ----------------======================================
            # INJEÇÃO DE CABEÇALHOS CORS AUTOMATIZADA NO GATEWAY
            # ----------------======================================
            add_header 'Access-Control-Allow-Origin' 'http://127.0.0.1:5500' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

            # Trata a requisição de pré-voo (Preflight OPTIONS) que o navegador faz por segurança
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://127.0.0.1:5500';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # ----------------================================================
            # BLINDAGEM DE DUPLICIDADE: Apaga o cabeçalho CORS gerado pelo Flask
            # ----------------================================================
            proxy_hide_header 'Access-Control-Allow-Origin';

            proxy_pass http://svc-catalogo:5001/api/produtos;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /stub_status {
            stub_status on;
            allow 127.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
